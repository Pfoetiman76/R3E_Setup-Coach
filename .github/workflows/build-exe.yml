name: build-exe

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[exe]
      - run: python tools/gen_icon.py
      - run: pyinstaller --onedir --windowed --noupx --icon assets/app.ico --add-data ".r3e-coach.json;." --add-data "assets/app.ico;." --name "R3E-Setup-Coach" r3e-coach-gui.py
      - run: powershell "(Get-FileHash dist\R3E-Setup-Coach\R3E-Setup-Coach.exe -Algorithm SHA256).Hash | Out-File dist\R3E-Setup-Coach\SHA256.txt -Encoding ascii"
      - uses: actions/upload-artifact@v4
        with:
          name: R3E-Setup-Coach-windows
          path: dist/R3E-Setup-Coach/
          retention-days: 30
