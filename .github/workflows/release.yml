name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[exe]
      - run: pyinstaller --onedir --windowed --noupx --name "R3E-Setup-Coach" r3e-coach-gui.py
      - run: powershell "(Get-FileHash dist\R3E-Setup-Coach\R3E-Setup-Coach.exe -Algorithm SHA256).Hash | Out-File dist\R3E-Setup-Coach\SHA256.txt -Encoding ascii"
      - run: powershell "Compress-Archive -Path dist\R3E-Setup-Coach\* -DestinationPath dist\R3E-Setup-Coach-win.zip -Force"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/R3E-Setup-Coach-win.zip
            dist/R3E-Setup-Coach/SHA256.txt
