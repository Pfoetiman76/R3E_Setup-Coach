name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[exe]
      - run: pyinstaller --onedir --windowed --noupx --add-data ".r3e-coach.json;." --name "R3E-Setup-Coach" r3e-coach-gui.py
      - run: powershell "(Get-FileHash dist\R3E-Setup-Coach\R3E-Setup-Coach.exe -Algorithm SHA256).Hash | Out-File dist\R3E-Setup-Coach\SHA256.txt -Encoding ascii"
      - run: powershell "Compress-Archive -Path dist\R3E-Setup-Coach\* -DestinationPath dist\R3E-Setup-Coach-win.zip -Force"
      - run: choco install innosetup -y
      - run: powershell -File installer\build-installer.ps1
      - run: powershell "$s = Get-ChildItem -Recurse -Filter 'R3E-Setup-Coach-Setup.exe' | Select-Object -First 1; Copy-Item $s.FullName 'dist\R3E-Setup-Coach-Setup.exe' -Force; (Get-FileHash 'dist\R3E-Setup-Coach-Setup.exe' -Algorithm SHA256).Hash | Out-File 'dist\SHA256-Setup.txt' -Encoding ascii"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/R3E-Setup-Coach-win.zip
            dist/R3E-Setup-Coach/SHA256.txt
            dist/R3E-Setup-Coach-Setup.exe
            dist/SHA256-Setup.txt
