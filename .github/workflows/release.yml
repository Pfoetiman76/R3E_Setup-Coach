name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag und Version pruefen (Fail-Loud)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          Write-Host "Tag: $tag | Version im Code: $v"
          if ($tag -ne "v$v") { throw "Tag '$tag' entspricht nicht der Version '$v' im getaggten Code - falscher Stand getaggt?" }
      - run: pip install .[exe]
      - run: python tools/gen_icon.py
      - run: pyinstaller --onedir --windowed --noupx --icon assets/app.ico --add-data ".r3e-coach.json;." --add-data "assets/app.ico;." --name "R3E-Setup-Coach" r3e-coach-gui.py
      - run: powershell "(Get-FileHash dist\R3E-Setup-Coach\R3E-Setup-Coach.exe -Algorithm SHA256).Hash | Out-File dist\R3E-Setup-Coach\SHA256.txt -Encoding ascii"
      - run: powershell "Compress-Archive -Path dist\R3E-Setup-Coach\* -DestinationPath dist\R3E-Setup-Coach-win.zip -Force"
      - run: choco install innosetup -y
      - run: powershell -File installer\build-installer.ps1
      - run: powershell -File installer\collect-setup.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/R3E-Setup-Coach-win.zip
            dist/R3E-Setup-Coach/SHA256.txt
            dist/R3E-Setup-Coach-Setup.exe
            dist/SHA256-Setup.txt
