<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Masken: Mauloeffnungen sauber ausstanzen -->
  <defs>
    <mask id="jawcut">
      <rect x="0" y="0" width="512" height="512" fill="white"/>
      <g fill="black">
        <rect x="243" y="118" width="26" height="60"/>
        <circle cx="256" cy="158" r="15"/>
        <rect x="243" y="330" width="26" height="60"/>
        <circle cx="256" cy="354" r="15"/>
      </g>
    </mask>
  </defs>
  <!-- Hintergrund -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#1c1c1e"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="none" stroke="#2a2a2d" stroke-width="4"/>

  <!-- Rennrad -->
  <circle cx="256" cy="256" r="127" fill="none" stroke="#e6e6e8" stroke-width="18"/>
  <circle cx="256" cy="256" r="93" fill="none" stroke="#e6e6e8" stroke-width="14"/>
  <g stroke="#e6e6e8" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="163" x2="256" y2="349"/>
    <line x1="163" y1="256" x2="349" y2="256"/>
  </g>
  <circle cx="256" cy="256" r="24" fill="#e6e6e8"/>

  <!-- Doppelmaulschluessel: klassische Silhouette, beide Enden offen, diagonal -->
  <g transform="rotate(45 256 256)">
    <g mask="url(#jawcut)">
      <rect x="242" y="176" width="28" height="160" rx="14" fill="#e8212b"/>
      <circle cx="256" cy="162" r="30" fill="#e8212b"/>
      <circle cx="256" cy="350" r="30" fill="#e8212b"/>
    </g>
  </g>

  <!-- Schriftzug -->
  <text x="256" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="44" font-weight="bold" fill="#e6e6e8" letter-spacing="4">SETUP COACH</text>
</svg>
