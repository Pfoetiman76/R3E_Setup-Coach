[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r3e-setup-coach"
version = "0.9.3"
description = "Zeichnet RaceRoom-Telemetrie über die R3E-Shared-Memory-Schnittstelle auf und gibt konkrete Setup-Empfehlungen"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
test = ["pytest>=7"]
exe = ["pyinstaller>=6"]

[project.scripts]
r3e-coach = "r3e_coach.cli:main"

[tool.setuptools.packages.find]
include = ["r3e_coach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]